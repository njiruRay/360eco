# Free Supabase projects are paused after ~7 days without activity, which takes
# the whole site down. This calls get_impact() once a day so the database always
# sees a real query. The URL and publishable key are public by design (they
# ship in the site bundle) — NEVER put the secret / service_role key here.
#
# GitHub disables scheduled workflows after 60 days with no commits; it emails
# a warning first, and "Enable workflow" on the Actions tab turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # daily, 09:17 Nairobi time
  workflow_dispatch: # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://ukzwgovtomisafyspxdk.supabase.co
      SUPABASE_KEY: sb_publishable_6tiLf7K84fAor2jXAgBIAQ_ZM3Tcv9e
    steps:
      - name: Query the database
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --max-time 60 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_impact" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
