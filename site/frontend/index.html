<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00652c" />
    <title>360 Econovations | Turning Waste Into Value</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <!--
      Eco Message splash (ported from the UI-UX prototype's cart.js loader).
      Deliberately inlined with plain CSS rather than built as a Vue component:
      it must paint on the very first frame, before the app bundle and the
      lazy-loaded first route have downloaded. Dismissed from main.js.
    -->
    <style>
      #eco-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6fbf2;
        color: #181d17;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #eco-loader.eco-loader-hide { opacity: 0; }
      #eco-loader.eco-loader-gone { display: none; }
      .eco-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: 100%;
        max-width: 28rem;
        box-sizing: border-box;
        text-align: center;
      }
      .eco-loader-ring {
        position: relative;
        width: 7rem;
        height: 7rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .eco-loader-spin {
        width: 4rem;
        height: 4rem;
        border-radius: 9999px;
        border: 4px solid rgba(190, 202, 188, 0.3);
        border-top-color: #15803d;
        animation: eco-spin 1s linear infinite;
      }
      .eco-loader-360 {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.125rem;
        color: #00652c;
      }
      .eco-loader-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        background: #81f8a4;
        color: #00723a;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .eco-loader-msg {
        width: 100%;
      }
      .eco-loader-tip {
        margin: 12px 0 0;
        padding: 0 16px;
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.6;
        overflow-wrap: break-word;
      }
      .eco-loader-sub {
        margin: 0;
        font-size: 0.75rem;
        color: rgba(63, 73, 63, 0.6);
        animation: eco-pulse 2s ease-in-out infinite;
      }
      @keyframes eco-spin { to { transform: rotate(360deg); } }
      @keyframes eco-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @media (prefers-reduced-motion: reduce) {
        .eco-loader-spin { animation: none; }
        .eco-loader-sub { animation: none; }
        #eco-loader { transition: none; }
      }
      html.dark #eco-loader { background: #111410; color: #edf2e9; }
      html.dark .eco-loader-sub { color: rgba(237, 242, 233, 0.6); }
    </style>
  </head>
  <body>
    <div id="eco-loader" role="status" aria-live="polite">
      <div class="eco-loader-inner">
        <div class="eco-loader-ring">
          <div class="eco-loader-spin"></div>
          <div class="eco-loader-360">360</div>
        </div>
        <div class="eco-loader-msg">
          <span class="eco-loader-badge">Eco Message</span>
          <p class="eco-loader-tip" id="eco-loader-tip"></p>
        </div>
        <p class="eco-loader-sub">Restoring circular balance...</p>
      </div>
    </div>
    <script>
      (function () {
        var tips = [
          'Every returnable glass bottle recycled saves enough energy to power a computer for 25 minutes.',
          'Biomass briquettes burn longer and generate 90% less smoke than standard wood charcoal.',
          'Recycling 1 ton of glass saves 1.2 tons of raw materials like sand and limestone.',
          '360 Econovations partners with local hospitality bars to intercept dumpsite waste.',
          'Clean color sorting increases glass recycling value for manufacturers by 50%.',
          'By choosing biomass briquettes, you prevent deforestation across Kenya.',
          'Returning glass bottles under the Rudisha program cuts carbon emissions by 40%.',
        ];

        var MIN_VISIBLE = 3000; // keep the message readable, as in the prototype
        var FADE = 500; // must match the CSS transition above
        var SAFETY = 7000; // never leave anyone stuck behind the splash

        var start = Date.now();
        var dismissed = false;
        var safety = null;

        function overlay() {
          return document.getElementById('eco-loader');
        }

        function pickTip() {
          var el = document.getElementById('eco-loader-tip');
          if (el) el.textContent = '"' + tips[Math.floor(Math.random() * tips.length)] + '"';
        }

        // Re-shown after a successful sign-in, so the overlay is parked with
        // display:none rather than removed from the DOM.
        function show() {
          var el = overlay();
          if (!el) return;
          if (safety) clearTimeout(safety);
          pickTip();
          el.classList.remove('eco-loader-gone');
          void el.offsetWidth; // reflow, so opacity animates 0 -> 1
          el.classList.remove('eco-loader-hide');
          start = Date.now();
          dismissed = false;
          safety = setTimeout(hide, SAFETY);
        }

        function hide() {
          if (dismissed) return;
          dismissed = true;
          var el = overlay();
          if (!el) return;
          if (safety) {
            clearTimeout(safety);
            safety = null;
          }
          setTimeout(function () {
            el.classList.add('eco-loader-hide');
            setTimeout(function () {
              el.classList.add('eco-loader-gone');
            }, FADE);
          }, Math.max(0, MIN_VISIBLE - (Date.now() - start)));
        }

        pickTip();

        window.__ecoLoaderShow = show;
        window.__ecoLoaderDone = hide;

        // Fallbacks so a bundle error can never trap the user behind the splash.
        window.addEventListener('load', hide);
        safety = setTimeout(hide, SAFETY);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
