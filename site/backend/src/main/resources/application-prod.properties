# ---- Production profile (activate with SPRING_PROFILES_ACTIVE=prod) ----
# Committed to git: this file must NEVER contain secrets. DB password, JWT
# secret and admin password are supplied as environment variables on the host
# (see /etc/econovations/backend.env on the Oracle VM).
#
# Every value below is still env-overridable, so the host can change any of it
# without a rebuild.

# ---- CORS ----
# Web origin is the Vercel deployment; the Capacitor origins are for the
# Android/iOS app builds, which serve their pages from a local origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://360eco.vercel.app,capacitor://localhost,http://localhost,https://localhost}

# ---- Frontend base URL ----
# Used to build password-reset links, so it must be the public site URL.
app.frontend-url=${FRONTEND_URL:https://360eco.vercel.app}

# ---- Logging ----
# No SQL pretty-printing or statement logging in production.
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
