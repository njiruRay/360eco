spring.application.name=backend

# Default to the local profile so application-local.properties (git-ignored)
# supplies DB credentials during development. Override with SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- Server ----
# All endpoints are served under /api to match the frontend's VITE_API_URL.
server.port=8080
server.servlet.context-path=/api

# ---- PostgreSQL datasource ----
# Real database is created in Phase 1. Override via environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/econovations
spring.datasource.username=${DB_USERNAME:econovations}
spring.datasource.password=${DB_PASSWORD:changeme}

# ---- JPA / Hibernate ----
# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway migrations (Phase 1) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- CORS allowed origins (dev browser + Capacitor apps) ----
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*,https://localhost:*,capacitor://localhost

# ---- JWT ----
# Dev default; MUST be overridden via JWT_SECRET in any real environment.
# Must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-please-min-32-bytes-econovations}
app.jwt.expiration-ms=86400000

# ---- Admin bootstrap ----
# Seeds a default super_admin if admin_users is empty (dev convenience).
# Override in real environments; change the password immediately.
app.admin.bootstrap-email=${ADMIN_EMAIL:admin@econovations.com}
app.admin.bootstrap-password=${ADMIN_PASSWORD:admin12345}

# ---- Password reset ----
# Base URL of the frontend, used to build the reset link (/reset-password?token=...).
app.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.reset.token-ttl-minutes=${RESET_TTL_MINUTES:60}
# Email delivery: leave disabled in dev (reset link is logged instead). In prod
# set MAIL_ENABLED=true and the standard spring.mail.* SMTP properties.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@econovations.com}
